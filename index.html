<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f23">
  <meta name="apple-mobile-web-app-title" content="即時翻譯">
  <meta name="application-name" content="即時翻譯">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>即時翻譯</title>
  <style>
    :root {
      --bg: #0f0f23;
      --surface: #1a1a2e;
      --surface2: #252542;
      --primary: #4f8cff;
      --accent: #00d4aa;
      --danger: #ff4757;
      --warn: #ffaa00;
      --text: #e8e8f0;
      --dim: #8888a0;
      --border: #2a2a4a;
      --r: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; overflow:hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── Top bar ── */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 16px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .topbar-right { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .icon-btn.active { background: var(--primary); border-color: var(--primary); }
    .icon-btn:active { opacity: .7; }

    /* ── Direction tabs ── */
    .dir-bar {
      flex-shrink: 0;
      display: flex; gap: 6px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .dir-btn {
      flex: 1; padding: 9px 4px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--dim);
      font-size: 13px; font-weight: 500;
      cursor: pointer; text-align: center; transition: all .2s;
    }
    .dir-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Scroll area ── */
    .feed {
      flex: 1; overflow-y: auto;
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .feed-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--dim); font-size: 14px; gap: 10px;
      text-align: center; padding: 40px 20px;
    }
    .feed-empty .ei { font-size: 56px; opacity: .3; }
    .feed-empty .et { line-height: 1.6; }

    /* ── Bubble pair ── */
    .pair { display: flex; flex-direction: column; gap: 6px; }
    .bubble {
      border-radius: var(--r);
      padding: 12px 16px;
      font-size: 16px; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap;
      max-width: 90%;
    }
    .bubble.src {
      background: var(--surface2);
      border: 1px solid var(--border);
      align-self: flex-end;
      color: var(--dim);
      font-size: 15px;
    }
    .bubble.dst {
      background: linear-gradient(135deg, #0a2a25 0%, #0d1f3c 100%);
      border: 1px solid var(--accent);
      align-self: flex-start;
      color: #00ffcc;
      font-size: 17px;
      font-weight: 500;
    }
    .bubble.dst.translating {
      color: var(--dim);
      font-style: italic;
      border-color: var(--border);
      background: var(--surface2);
    }
    .bubble-actions {
      display: flex; gap: 6px;
      align-self: flex-start;
      margin-top: -2px;
    }
    .bact {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 10px;
      color: var(--dim); font-size: 12px; cursor: pointer;
      transition: all .15s;
    }
    .bact:active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Live caption (interim result) ── */
    .live-caption {
      flex-shrink: 0;
      min-height: 36px;
      padding: 8px 16px;
      font-size: 15px; color: var(--dim);
      font-style: italic;
      border-top: 1px solid var(--border);
      background: var(--surface);
      word-break: break-word;
    }
    .live-caption.active { color: var(--text); }

    /* ── Status strip ── */
    .status-strip {
      flex-shrink: 0;
      text-align: center; font-size: 12px;
      padding: 3px 0; min-height: 20px;
      color: var(--dim);
    }
    .status-strip.busy  { color: var(--primary); }
    .status-strip.error { color: var(--danger); }
    .status-strip.ok    { color: var(--accent); }

    /* ── Big mic button area ── */
    .mic-area {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      padding: 14px 16px max(16px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .mic-ring {
      position: relative;
      width: 80px; height: 80px;
    }
    .mic-ring::before {
      content: '';
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color .3s;
    }
    .mic-ring.active::before {
      border-color: var(--danger);
      animation: ring-pulse 1.4s ease-in-out infinite;
    }
    .mic-ring.speaking::before { border-color: var(--warn); }
    @keyframes ring-pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.1); opacity: .6; }
    }
    .mic-btn {
      width: 80px; height: 80px; border-radius: 50%;
      border: none; cursor: pointer;
      font-size: 32px;
      display: flex; align-items: center; justify-content: center;
      transition: all .25s;
      position: relative; z-index: 1;
      background: var(--surface2);
      box-shadow: 0 2px 16px rgba(0,0,0,.3);
    }
    .mic-btn.idle    { background: var(--primary); box-shadow: 0 0 24px #4f8cff44; }
    .mic-btn.listening { background: var(--danger); box-shadow: 0 0 28px #ff475744; animation: mic-pulse 1.2s ease-in-out infinite; }
    .mic-btn.translating { background: var(--warn); box-shadow: 0 0 24px #ffaa0044; }
    .mic-btn.speaking  { background: var(--accent); box-shadow: 0 0 24px #00d4aa44; }
    @keyframes mic-pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    .mic-label {
      font-size: 12px; color: var(--dim);
      text-align: center; height: 16px;
    }

    /* ── Text fallback row ── */
    .text-row {
      display: flex; gap: 8px;
      padding: 0 16px 10px;
      background: var(--surface);
    }
    .text-input {
      flex: 1;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 24px; padding: 10px 16px;
      color: var(--text); font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    .text-input:focus { border-color: var(--primary); }
    .text-input::placeholder { color: var(--dim); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: none; background: var(--accent);
      color: #fff; font-size: 18px; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .send-btn:active { opacity: .7; }

    /* ── Settings sheet ── */
    .sheet-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.55); z-index: 200;
    }
    .sheet-bg.show { display: block; }
    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px max(24px, env(safe-area-inset-bottom));
      z-index: 201;
      transform: translateY(100%);
      transition: transform .3s ease;
      max-height: 85vh; overflow-y: auto;
    }
    .sheet-bg.show .sheet { transform: translateY(0); }
    .sheet h2 { font-size: 17px; margin-bottom: 20px; text-align: center; }
    .sg { margin-bottom: 16px; }
    .sg label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
    .sg input, .sg select {
      width: 100%;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 13px;
      color: var(--text); font-size: 15px; outline: none;
    }
    .sg input:focus, .sg select:focus { border-color: var(--primary); }
    .sg select option { background: var(--surface); }
    .tr { display:flex; align-items:center; justify-content:space-between; padding: 10px 0; }
    .tr span { font-size: 15px; }
    .tog {
      position: relative; width: 46px; height: 26px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 13px; cursor: pointer; transition: background .2s;
    }
    .tog.on { background: var(--primary); border-color: var(--primary); }
    .tog::after {
      content:''; position:absolute; top:2px; left:2px;
      width:20px; height:20px; background:#fff;
      border-radius:50%; transition:transform .2s;
    }
    .tog.on::after { transform: translateX(20px); }
    .sheet-close {
      width:100%; padding:13px;
      background: var(--primary); color:#fff;
      border:none; border-radius:10px;
      font-size:15px; font-weight:600; cursor:pointer; margin-top:12px;
    }
    .hint { font-size:11px; color:var(--dim); margin-top:5px; line-height:1.5; }
    .hint a { color:var(--primary); text-decoration:none; }

    /* ── History clear ── */
    .hist-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 0 6px;
      font-size: 12px; color: var(--dim);
    }
    .hist-clear { color: var(--danger); cursor: pointer; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>🌐 即時翻譯</h1>
  <div class="topbar-right">
    <button class="icon-btn" id="settingsBtn" onclick="openSettings()">⚙️</button>
  </div>
</div>

<!-- Direction -->
<div class="dir-bar">
  <button class="dir-btn active" data-dir="auto"  onclick="setDir('auto')">自動偵測</button>
  <button class="dir-btn"        data-dir="zh-en" onclick="setDir('zh-en')">中 → 英</button>
  <button class="dir-btn"        data-dir="en-zh" onclick="setDir('en-zh')">英 → 中</button>
</div>

<!-- Feed -->
<div class="feed" id="feed">
  <div class="feed-empty" id="feedEmpty">
    <div class="ei">🎤</div>
    <div class="et">按下麥克風開啟持續聆聽模式<br><span style="font-size:12px;opacity:.6">說話停頓後自動翻譯並朗讀，<br>再次說話繼續下一句</span></div>
  </div>
</div>

<!-- Live caption (interim) -->
<div class="live-caption" id="liveCaption">　</div>

<!-- Status -->
<div class="status-strip" id="status"></div>

<!-- Text input fallback -->
<div class="text-row">
  <input type="text" class="text-input" id="textInput" placeholder="也可以打字翻譯..."
         onkeydown="if(event.key==='Enter'){translateText(this.value.trim());this.value='';}">
  <button class="send-btn" onclick="onSendText()">➤</button>
</div>

<!-- Mic -->
<div class="mic-area">
  <div class="mic-ring" id="micRing">
    <button class="mic-btn idle" id="micBtn" onclick="toggleListen()">🎤</button>
  </div>
  <div class="mic-label" id="micLabel">點擊開始聆聽</div>
</div>

<!-- Settings sheet -->
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <h2>⚙️ 設定</h2>
    <div class="sg">
      <label>語音辨識語言</label>
      <select id="speechLangSel">
        <option value="auto">自動（跟翻譯方向一致）</option>
        <option value="zh-TW">中文（台灣）</option>
        <option value="zh-CN">中文（普通話）</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
      </select>
    </div>
    <div class="tr">
      <span>翻譯後自動朗讀</span>
      <div class="tog" id="autoSpeakTog" onclick="toggleAutoSpeak()"></div>
    </div>
    <div class="tr">
      <span>朗讀時暫停聆聽</span>
      <div class="tog on" id="pauseOnTTSTog" onclick="togglePauseOnTTS()"></div>
    </div>
    <button class="sheet-close" onclick="closeSettings()">完成</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════
const SK = {
  dir:    'tx_dir',
  spk:    'tx_autospeak',
  pause:  'tx_pauseontts',
  slang:  'tx_speechlang'
};

// API endpoint — always our own server, no key needed in frontend
const API_BASE = '';  // same origin, relative path

let dir       = localStorage.getItem(SK.dir)   || 'auto';
let autoSpeak = localStorage.getItem(SK.spk)   === 'true';
let pauseOnTTS= localStorage.getItem(SK.pause) !== 'false';
let speechLang= localStorage.getItem(SK.slang) || 'auto';

// ═══════════════════════════════════════════════════════
//  Speech Recognition
// ═══════════════════════════════════════════════════════
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let listenMode = false;   // user wants continuous listening
let isSpeaking = false;   // TTS is playing
let isTranslating = false;// API call in flight
let restartTimer = null;
let lastFinal = '';       // deduplicate

// Mic FSM states: idle | listening | translating | speaking
let micState = 'idle';

function getSpeechLang() {
  if (speechLang !== 'auto') return speechLang;
  if (dir === 'zh-en') return 'zh-TW';
  if (dir === 'en-zh') return 'en-US';
  return 'zh-TW'; // auto: default Chinese, Gemini will figure out direction
}

function initRecog() {
  if (!SR) return;
  recog = new SR();
  recog.continuous    = false; // We restart manually for iOS compatibility
  recog.interimResults= true;
  recog.maxAlternatives = 1;
  recog.lang = getSpeechLang();

  recog.onstart = () => {
    setMicState('listening');
    setStatus('聆聽中…');
    setCaption('', false);
  };

  recog.onresult = (e) => {
    let interim = '';
    let final   = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (interim) setCaption(interim, true);
    if (final) {
      setCaption(final, true);
      lastFinal = final;
    }
  };

  recog.onspeechend = () => {
    // Speech stopped — commit what we have
    recog.stop();
  };

  recog.onerror = (e) => {
    if (e.error === 'no-speech') {
      // Silence — just restart
      scheduleRestart(300);
      return;
    }
    if (e.error === 'not-allowed') {
      setStatus('麥克風權限被拒絕', 'error');
      stopListenMode();
      return;
    }
    if (e.error === 'aborted') return; // we caused this
    setStatus('語音錯誤: ' + e.error, 'error');
    scheduleRestart(1000);
  };

  recog.onend = () => {
    // Fired after stop(). If we have a final result, translate it.
    if (listenMode) {
      const text = lastFinal.trim();
      lastFinal = '';
      if (text) {
        doTranslate(text);
      } else {
        // Nothing heard — restart
        scheduleRestart(200);
      }
    } else {
      setMicState('idle');
      setStatus('');
      setCaption('', false);
    }
  };
}

function startRecog() {
  if (!recog) { setStatus('此裝置不支援語音辨識', 'error'); return; }
  if (isSpeaking && pauseOnTTS) return; // wait for TTS to finish
  recog.lang = getSpeechLang();
  try { recog.start(); } catch(e) { scheduleRestart(400); }
}

function scheduleRestart(ms) {
  if (!listenMode) return;
  if (restartTimer) clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if (listenMode && !isSpeaking && !isTranslating) startRecog();
  }, ms);
}

// ── Toggle listen mode ──────────────────────────────
function toggleListen() {
  if (!SR) { setStatus('此裝置不支援語音辨識，請用 Chrome 或 Safari','error'); return; }

  if (listenMode) {
    stopListenMode();
  } else {
    startListenMode();
  }
}

function startListenMode() {
  listenMode = true;
  if (!recog) initRecog();
  startRecog();
  setMicLabel('點擊停止');
}

function stopListenMode() {
  listenMode = false;
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
  try { recog && recog.abort(); } catch(e) {}
  setMicState('idle');
  setStatus('');
  setCaption('', false);
  setMicLabel('點擊開始聆聽');
}

// ═══════════════════════════════════════════════════════
//  Translation
// ═══════════════════════════════════════════════════════

async function doTranslate(text) {
  if (!text) { scheduleRestart(200); return; }
  isTranslating = true;
  setMicState('translating');
  setStatus('翻譯中…', 'busy');
  setCaption('', false);
  hideFeedEmpty();

  const pair = addPair(text);

  try {
    const resp = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, direction: dir })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const translation = data.translation;
    if (!translation) throw new Error('翻譯結果為空');

    // Update bubble
    setDstBubble(pair, translation);
    setStatus('', 'ok');

    // TTS
    if (autoSpeak) {
      await speakText(translation);
    }

  } catch(err) {
    setDstBubble(pair, '❌ ' + err.message, true);
    setStatus(err.message, 'error');
  }

  isTranslating = false;

  // Resume listening
  if (listenMode) {
    scheduleRestart(autoSpeak ? 200 : 300);
  }
}

// ── Text input fallback ──────────────────────────────
function onSendText() {
  const inp = document.getElementById('textInput');
  const t = inp.value.trim();
  inp.value = '';
  if (t) translateText(t);
}

function translateText(text) {
  if (!text) return;
  doTranslate(text);
}

// ═══════════════════════════════════════════════════════
//  TTS
// ═══════════════════════════════════════════════════════
function speakText(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { resolve(); return; }
    speechSynthesis.cancel();

    const isChinese = /[\u4e00-\u9fff]/.test(text);
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = isChinese ? 'zh-TW' : 'en-US';
    utter.rate = 1.05;

    isSpeaking = true;
    setMicState('speaking');
    if (listenMode && pauseOnTTS) {
      try { recog && recog.abort(); } catch(e) {}
    }

    utter.onend = utter.onerror = () => {
      isSpeaking = false;
      if (listenMode) {
        setMicState('listening');
        scheduleRestart(300);
      } else {
        setMicState('idle');
      }
      resolve();
    };

    speechSynthesis.speak(utter);
  });
}

// ═══════════════════════════════════════════════════════
//  Feed / bubbles
// ═══════════════════════════════════════════════════════
let pairCount = 0;

function hideFeedEmpty() {
  const e = document.getElementById('feedEmpty');
  if (e) e.style.display = 'none';
}

function addPair(srcText) {
  const id = 'pair-' + (++pairCount);
  const feed = document.getElementById('feed');

  const pair = document.createElement('div');
  pair.className = 'pair';
  pair.id = id;

  // Source bubble
  const src = document.createElement('div');
  src.className = 'bubble src';
  src.textContent = srcText;
  pair.appendChild(src);

  // Dest bubble (placeholder)
  const dst = document.createElement('div');
  dst.className = 'bubble dst translating';
  dst.textContent = '翻譯中…';
  dst.id = id + '-dst';
  pair.appendChild(dst);

  feed.appendChild(pair);
  feed.scrollTop = feed.scrollHeight;
  return id;
}

function setDstBubble(pairId, text, isError) {
  const dst = document.getElementById(pairId + '-dst');
  if (!dst) return;
  dst.textContent = text;
  dst.classList.remove('translating');
  if (isError) {
    dst.style.color = 'var(--danger)';
    dst.style.borderColor = 'var(--danger)';
  } else {
    // Add action buttons
    const actions = document.createElement('div');
    actions.className = 'bubble-actions';

    const speakBtn = document.createElement('button');
    speakBtn.className = 'bact';
    speakBtn.textContent = '🔊 朗讀';
    speakBtn.onclick = () => speakText(text);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'bact';
    copyBtn.textContent = '📋 複製';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(text).then(() => setStatus('已複製', 'ok'));
    };

    actions.appendChild(speakBtn);
    actions.appendChild(copyBtn);

    const pair = document.getElementById(pairId);
    pair.appendChild(actions);
  }

  // Scroll
  const feed = document.getElementById('feed');
  feed.scrollTop = feed.scrollHeight;
}

// ═══════════════════════════════════════════════════════
//  UI helpers
// ═══════════════════════════════════════════════════════
function setMicState(s) {
  micState = s;
  const btn  = document.getElementById('micBtn');
  const ring = document.getElementById('micRing');
  btn.className  = 'mic-btn ' + s;
  ring.className = 'mic-ring ' + (s === 'listening' ? 'active' : s === 'speaking' ? 'speaking' : '');

  const icons = { idle:'🎤', listening:'🔴', translating:'⏳', speaking:'🔊' };
  btn.textContent = icons[s] || '🎤';
}

function setMicLabel(t) {
  document.getElementById('micLabel').textContent = t;
}

function setCaption(t, active) {
  const el = document.getElementById('liveCaption');
  el.textContent = t || '　';
  el.classList.toggle('active', active && !!t);
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'status-strip' + (type ? ' ' + type : '');
}

function setDir(d) {
  dir = d;
  localStorage.setItem(SK.dir, d);
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.toggle('active', b.dataset.dir === d));
  if (recog) recog.lang = getSpeechLang();
}

// ═══════════════════════════════════════════════════════
//  Settings
// ═══════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('speechLangSel').value = speechLang;
  document.getElementById('autoSpeakTog').classList.toggle('on', autoSpeak);
  document.getElementById('pauseOnTTSTog').classList.toggle('on', pauseOnTTS);
  document.getElementById('sheetBg').classList.add('show');
}

function closeSettings() {
  speechLang = document.getElementById('speechLangSel').value;
  localStorage.setItem(SK.slang, speechLang);
  document.getElementById('sheetBg').classList.remove('show');
}

function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  localStorage.setItem(SK.spk, autoSpeak);
  document.getElementById('autoSpeakTog').classList.toggle('on', autoSpeak);
}

function togglePauseOnTTS() {
  pauseOnTTS = !pauseOnTTS;
  localStorage.setItem(SK.pause, pauseOnTTS);
  document.getElementById('pauseOnTTSTog').classList.toggle('on', pauseOnTTS);
}

// ═══════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════
function init() {
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.toggle('active', b.dataset.dir === dir));
  if (!SR) setStatus('此裝置不支援語音辨識，可用打字模式', 'error');
  initRecog();
}

init();

// PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
