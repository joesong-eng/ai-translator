<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>🌐 AI 翻譯模式</h2>

    <div class="section">
      <div class="toggle-row">
        <span>翻譯模式</span>
        <div class="toggle" id="activeToggle"></div>
      </div>
    </div>

    <div class="section">
      <label>翻譯方向</label>
      <select id="directionSelect">
        <option value="auto">自動偵測</option>
        <option value="zh-en">中 → 英</option>
        <option value="en-zh">英 → 中</option>
      </select>
    </div>

    <div class="section">
      <div class="toggle-row">
        <span>自動朗讀回應</span>
        <div class="toggle" id="speakToggle"></div>
      </div>
      <div class="hint">AI 回應完成後自動朗讀（使用瀏覽器語音）</div>
    </div>

    <div class="section status-box" id="statusBox">
      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">載入中...</span>
      </div>
      <div class="status-detail" id="statusDetail"></div>
    </div>

    <div class="hint">
      快捷鍵：Ctrl+Shift+T 切換翻譯模式<br>
      支援：Gemini、ChatGPT
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
